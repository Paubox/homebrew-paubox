name: Validate Formula

# Runs `brew audit`, `brew install --build-from-source`, and `brew test`
# on every PR and every push to master that touches a formula or this
# workflow file.
#
# Why this exists: update-formula.yml only runs these checks when the
# auto-bumper is pushing a version change. Formula-only edits (refactors,
# install-block changes, test-block changes) currently ship to master
# un-validated -- which is how a broken install reached production. This
# workflow closes that gap.
#
# Why macOS runners: the install bug we hit (npm 5.0+ symlinks the source
# directory under `npm install --global`) reproduces on macOS Homebrew,
# and keytar's native binary postinstall is platform-specific. Linuxbrew
# would miss both signals.

on:
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/validate-formula.yml"
  push:
    branches: [master]
    paths:
      - "Formula/**"
      - ".github/workflows/validate-formula.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        # @main, not @master: Homebrew/actions renamed its default branch, and
        # the old ref stopped resolving at all.
        uses: Homebrew/actions/setup-homebrew@main

      - name: Audit, install, and test every formula
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in Formula/*.rb; do
            # Tap-qualified name, not path: `brew audit [path ...]` is disabled
            # upstream. setup-homebrew symlinks this checkout in as the tap, so
            # the name resolves to the formula in this PR, not the published one.
            name="paubox/paubox/$(basename "$f" .rb)"

            echo "::group::brew audit --strict --online $name"
            brew audit --strict --online "$name"
            echo "::endgroup::"

            echo "::group::brew install --build-from-source $name"
            brew install --build-from-source "$name"
            echo "::endgroup::"

            echo "::group::brew test $name"
            brew test "$name"
            echo "::endgroup::"
          done
